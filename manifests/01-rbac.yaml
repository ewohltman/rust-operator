apiVersion: v1
kind: ServiceAccount
metadata:
  name: rust-operator
  namespace: rust-operator
  labels:
    app.kubernetes.io/name: rust-operator
---
# Least privilege: only what the controller calls today (LEARN.md step 17).
# No delete anywhere: garbage collection removes children via owner references.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rust-operator
  labels:
    app.kubernetes.io/name: rust-operator
rules:
  - apiGroups: [ "demo.ephemeral-roles.net" ]
    resources: [ "webpages" ]
    # Add "patch" when the finalizer lands (step 13).
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "demo.ephemeral-roles.net" ]
    resources: [ "webpages/status" ]
    verbs: [ "patch" ]
  - apiGroups: [ "demo.ephemeral-roles.net" ]
    resources: [ "webpages/finalizers" ]
    verbs: [ "update" ]
  # Server-side apply needs create as well as patch.
  - apiGroups: [ "" ]
    resources: [ "namespaces", "configmaps", "services" ]
    verbs: [ "get", "list", "watch", "create", "patch" ]
  - apiGroups: [ "apps" ]
    resources: [ "deployments" ]
    verbs: [ "get", "list", "watch", "create", "patch" ]
  - apiGroups: [ "gateway.networking.k8s.io" ]
    resources: [ "httproutes" ]
    verbs: [ "get", "list", "watch", "create", "patch" ]
  - apiGroups: [ "events.k8s.io" ]
    resources: [ "events" ]
    verbs: [ "create", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rust-operator
  labels:
    app.kubernetes.io/name: rust-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rust-operator
subjects:
  - kind: ServiceAccount
    name: rust-operator
    namespace: rust-operator
