[package]
name = "rust-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ewohltman/rust-operator"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
kube = { version = "5.0.0", features = ["runtime", "derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1.0.104"
either = "1.19.0"
futures = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
